[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denshift"
version = "0.1.0"
description = "Source-free, gradient-free test-time adaptation for 3D point clouds under density shift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "denshift contributors" }]
keywords = ["point-cloud", "test-time-adaptation", "domain-shift", "robustness", "3d-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["denshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
